name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Build Design System
              run: npm run setup:ds

            - name: Generate Prisma Client
              run: npm run db:generate
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ec_finance

            - name: Run automated tests and check coverage
              run: npm run test:coverage

            - name: Validate TypeScript
              run: npm run typecheck

            - name: Build Next.js application
              run: npm run build

    postgres-integration:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ec_finance_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d ec_finance_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ec_finance_test?schema=public

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Generate Prisma Client
              run: npm run db:generate

            - name: Apply reviewed Prisma migrations
              run: npx prisma migrate deploy


            - name: Verify tenant isolation against PostgreSQL
              run: npm run test:integration
